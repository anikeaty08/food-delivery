[project]
name = "food-order-bot"
version = "0.1.0"
description = "Swiggy MCP Telegram ordering bot with config-driven CrewAI agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.60.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=21.10",
  "pyyaml>=6.0.2",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
agents = [
  "crewai>=1.14.0; python_version < '3.14'"
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0"
]

[project.scripts]
food-order-bot = "food_order_bot.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
